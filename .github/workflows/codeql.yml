name: CodeQL

# Static analysis (SAST) of the application source itself - looks for
# injection flaws, broken auth checks, unsafe deserialization, etc. Results
# land in the repo's Security -> Code scanning tab automatically; this never
# fails the build (see README's DevSecOps section on the report-only policy).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1" # every Monday, offset from security.yml's job

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Covers the Node backend + React frontend (javascript-typescript)
        # and the booking-service (python).
        language: ["javascript-typescript", "python"]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
