# Dedicated identity per workload, rather than sharing the namespace's
# "default" ServiceAccount - good practice for auditability. It has no
# RoleBinding because the backend never calls the Kubernetes API; combined
# with automountServiceAccountToken: false on the Deployment, no API
# credentials are even present inside the pod (least privilege).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: temple
automountServiceAccountToken: false
