apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: temple
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # node:20-alpine's built-in "node" user
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          # "temple-backend" is a symbolic placeholder name - the root
          # kustomization.yaml's `images:` transformer rewrites this to the
          # real ghcr.io image + tag. Don't point this at a real registry
          # here; edit kustomization.yaml (or let CI do it) instead.
          image: temple-backend
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 5000
          volumeMounts:
            # Node doesn't need to write anywhere else, but some libraries
            # assume /tmp is writable even with a read-only root filesystem.
            - name: tmp
              mountPath: /tmp
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef: { name: temple-config, key: NODE_ENV }
            - name: PORT
              value: "5000"
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef: { name: temple-config, key: BACKEND_MONGO_URI }
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef: { name: temple-config, key: CORS_ORIGIN }
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef: { name: temple-config, key: JWT_EXPIRES_IN }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: temple-secrets, key: JWT_SECRET }
            - name: RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef: { name: temple-secrets, key: RAZORPAY_KEY_ID, optional: true }
            - name: RAZORPAY_KEY_SECRET
              valueFrom:
                secretKeyRef: { name: temple-secrets, key: RAZORPAY_KEY_SECRET, optional: true }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
