server {
    # 8080, not 80: this container runs nginx as a non-root user (see
    # Dockerfile), which can't bind privileged ports below 1024.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline security headers (DevSecOps hardening). CSP is intentionally
    # a little permissive (Razorpay Checkout injects an iframe/script) - see
    # README's DevSecOps section if you tighten this further.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; connect-src 'self' https://api.razorpay.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'" always;

    # Serve the React SPA - any unknown path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container (see docker-compose.yml).
    # In production behind your own reverse proxy / hosting provider, adjust
    # this or point VITE_API_URL directly at the backend's public URL instead.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy to the separate Python booking-service (see /booking-service).
    # "booking-service" resolves via Docker Compose's / Kubernetes' internal
    # DNS as long as that's also the Service/container name there.
    location /booking-api/ {
        proxy_pass http://booking-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
