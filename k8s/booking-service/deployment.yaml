apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: temple
  labels:
    app: booking-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      serviceAccountName: booking-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # pinned in booking-service/Dockerfile
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: booking-service
          # Symbolic placeholder - see the note in backend/deployment.yaml.
          image: temple-booking-service
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: PORT
              value: "8000"
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef: { name: temple-config, key: BOOKING_MONGO_URI }
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef: { name: temple-config, key: CORS_ORIGIN }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: temple-secrets, key: JWT_SECRET }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
