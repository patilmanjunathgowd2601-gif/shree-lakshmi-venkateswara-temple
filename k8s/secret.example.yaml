# This is a TEMPLATE, not something ArgoCD applies automatically - it is
# deliberately excluded from kustomization.yaml's resources list.
#
# Secrets don't belong in git, even in a private repo. Create the real thing
# once, directly in the cluster, with:
#
#   kubectl create namespace temple --dry-run=client -o yaml | kubectl apply -f -
#   kubectl create secret generic temple-secrets -n temple \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=RAZORPAY_KEY_ID=rzp_test_xxxxxxxxxxxx \
#     --from-literal=RAZORPAY_KEY_SECRET=your_test_key_secret \
#     --from-literal=ADMIN_EMAIL=admin@srilakshmivenkateswara.org \
#     --from-literal=ADMIN_PASSWORD=change-me-immediately
#
# The Deployments in this directory reference this Secret by name
# (temple-secrets) via secretKeyRef, so they'll start failing/CrashLooping
# until you've created it. See the README's Kubernetes section.
#
# For a more production-grade setup, replace this manual step with a secrets
# operator such as External Secrets Operator or Bitnami Sealed Secrets, which
# lets you safely commit an *encrypted* version of this file to git instead.
apiVersion: v1
kind: Secret
metadata:
  name: temple-secrets
  namespace: temple
type: Opaque
stringData:
  JWT_SECRET: change-this-to-a-long-random-secret
  RAZORPAY_KEY_ID: rzp_test_xxxxxxxxxxxx
  RAZORPAY_KEY_SECRET: your_test_key_secret
  ADMIN_EMAIL: admin@srilakshmivenkateswara.org
  ADMIN_PASSWORD: change-me-immediately
