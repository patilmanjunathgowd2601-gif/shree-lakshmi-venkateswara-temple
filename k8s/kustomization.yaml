apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- configmap.yaml
- networkpolicy-default-deny.yaml
- mongo/serviceaccount.yaml
- mongo/pvc.yaml
- mongo/deployment.yaml
- mongo/service.yaml
- mongo/networkpolicy.yaml
- backend/serviceaccount.yaml
- backend/deployment.yaml
- backend/service.yaml
- backend/servicemonitor.yaml
- backend/networkpolicy.yaml
- booking-service/serviceaccount.yaml
- booking-service/deployment.yaml
- booking-service/service.yaml
- booking-service/servicemonitor.yaml
- booking-service/networkpolicy.yaml
- frontend/serviceaccount.yaml
- frontend/deployment.yaml
- frontend/service.yaml
- frontend/networkpolicy.yaml
- ingress.yaml

# NOTE: k8s/secret.example.yaml is intentionally NOT listed here - secrets are
# created directly in the cluster instead of committed to git. See that
# file's comments and the README's Kubernetes section.

# Rewrites the symbolic "temple-*" image names used in each Deployment to the
# real ghcr.io images. Replace CHANGEME/CHANGEME once you've pushed this repo
# to your own GitHub account (or let the "Update image tags" CI job in
# .github/workflows/cd.yml do it automatically on every push to main).
images:
- name: temple-backend
  newName: ghcr.io/patilmanjunathgowd2601-gif/shree-lakshmi-venkateswara-temple-backend
  newTag: c62b76c247c138d3bd82f5b73253f9a1380eff5a
- name: temple-booking-service
  newName: ghcr.io/patilmanjunathgowd2601-gif/shree-lakshmi-venkateswara-temple-booking-service
  newTag: c62b76c247c138d3bd82f5b73253f9a1380eff5a
- name: temple-frontend
  newName: ghcr.io/patilmanjunathgowd2601-gif/shree-lakshmi-venkateswara-temple-frontend
  newTag: c62b76c247c138d3bd82f5b73253f9a1380eff5a
